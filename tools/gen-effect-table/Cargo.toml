[package]
name = "gen-effect-table"
version = "0.1.0"
edition = "2024"

# One-shot generator binary. Parses dhxj's RagEffect.h / RagEffect.cpp and
# emits Rust source under lib/game/src/effect/. Run by hand when re-syncing
# from upstream dhxj; not part of the regular build.

[[bin]]
name = "gen-effect-table"
path = "src/main.rs"
